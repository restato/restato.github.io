name: Deploy Astro site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_GA_ID: G-CJKYE91FQM
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Scrape job listings
        run: node scripts/scrape-jobs.mjs
        continue-on-error: true

      - name: Verify air quality App Store page source contract
        run: npx vitest run src/pages/apps/air-quality/__tests__/pages.test.ts

      - name: Build with Astro
        run: npm run build

      - name: Verify Google Analytics configuration
        run: node --input-type=module -e 'import { readFileSync } from "node:fs"; const html = readFileSync("dist/blog/index.html", "utf8"); if (!html.includes(`data-ga-id="${process.env.PUBLIC_GA_ID}"`)) process.exit(1)'

      - name: Verify air quality App Store rendered pages
        run: npm run verify:air-quality-app-pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
