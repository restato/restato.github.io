name: quality

on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: node scripts/test-knowledge-article-schema.mjs
      - name: Verify air quality App Store page source contract
        run: npx vitest run src/pages/apps/air-quality/__tests__/pages.test.ts
      - run: npm run build
      - name: Verify air quality App Store rendered pages
        run: npm run verify:air-quality-app-pages
